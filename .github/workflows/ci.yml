name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-grammar:
    name: Test grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Run corpus tests
        run: npx tree-sitter test

      - name: Check xonsh coverage
        run: python3 scripts/check_coverage.py

  test-python-bindings:
    name: Test Python bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install .

      - name: Test import
        run: python -c "import tree_sitter_xonsh; print(tree_sitter_xonsh.language())"

  test-rust-bindings:
    name: Test Rust bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Rust tests
        run: cargo test

      # `cargo test` never looks at what gets packaged: an `include` pattern
      # that sweeps in build artifacts, or drops a header the build needs,
      # only shows up here
      - name: Check the crate packages
        run: cargo publish --dry-run

  test-node-bindings:
    name: Test Node bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Node tests
        run: npm test
        continue-on-error: true  # Remove once node tests are set up
