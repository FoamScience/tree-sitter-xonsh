name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_ARCHS_WINDOWS: AMD64

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/tree-sitter-xonsh
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io/crates/tree-sitter-xonsh
    permissions:
      id-token: write  # OIDC token exchange, as the PyPI job does

    steps:
      - uses: actions/checkout@v4

      # the version lives in five manifests; a tag that disagrees with
      # Cargo.toml would publish the wrong number, and it cannot be taken back
      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          tag="${GITHUB_REF#refs/tags/v}"
          test "$crate" = "$tag" || {
            echo "Cargo.toml is $crate but the tag is v$tag"; exit 1;
          }

      # trusted publishing: crates.io hands out a short-lived token to this
      # repo+workflow, revoked when the job ends — no stored secret. Configure
      # it on the crate's Settings page; it needs one manual publish first.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Without trusted publishing, drop the auth step above and use a
          # repository secret instead: ${{ secrets.CARGO_REGISTRY_TOKEN }}
